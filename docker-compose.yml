services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentconstruct
      POSTGRES_USER: agentconstruct
      POSTGRES_PASSWORD: agentconstruct
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentconstruct -d agentconstruct"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: ["agentconstruct-postgres:/var/lib/postgresql/data"]

  opa:
    image: openpolicyagent/opa:1.0.0-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/agentconstruct.rego"]
    ports:
      - "8181:8181"
    volumes: ["./platform/opa:/policies:ro"]

  fixture-executor:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uvicorn", "agentconstruct.fixture_executor:app", "--host", "0.0.0.0", "--port", "8090"]
    ports: ["8090:8090"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uvicorn", "agentconstruct.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      AGENTCONSTRUCT_DATABASE_URL: postgresql+psycopg://agentconstruct:agentconstruct@postgres:5432/agentconstruct
      AGENTCONSTRUCT_OPA_URL: http://opa:8181/v1/data/agentconstruct/decision
      AGENTCONSTRUCT_EXECUTOR_URL: http://fixture-executor:8090
      AGENTCONSTRUCT_LOCAL_SIGNING_KEY: local-compose-fixture-signing-key-at-least-32-bytes
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres: {condition: service_healthy}
      opa: {condition: service_started}
      fixture-executor: {condition: service_started}
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./platform/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./platform/tempo/tempo.yml:/etc/tempo.yml:ro"]
    ports: ["3200:3200"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes: ["./platform/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro"]
    depends_on: [tempo]

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    volumes:
      - "./platform/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./dashboards:/var/lib/grafana/dashboards:ro"
    depends_on: [prometheus, tempo]

volumes:
  agentconstruct-postgres:
