AWSTemplateFormatVersion: "2010-09-09"
Description: davdeploy read-only AWS discovery connection. Creates no workload resources.

Parameters:
  davdeployControlPlaneRoleArn:
    Type: String
    Description: davdeploy role allowed to assume this read-only customer role.
  ExternalId:
    Type: String
    NoEcho: true
    Description: Unique davdeploy connection value for this customer account.
  ConnectionId:
    Type: String
    AllowedPattern: "[A-Za-z0-9-]{8,40}"
    Description: Non-secret davdeploy connection identifier.

Resources:
  DiscoveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "davdeployDiscovery-${ConnectionId}"
      Description: davdeploy read-only infrastructure and cost discovery. No workload mutation or data access.
      MaxSessionDuration: 3600
      Tags:
        - Key: ManagedBy
          Value: davdeploy
        - Key: ConnectionId
          Value: !Ref ConnectionId
        - Key: Access
          Value: discovery-read-only
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref davdeployControlPlaneRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: davdeployDiscoveryMetadataOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DiscoverInfrastructureMetadata
                Effect: Allow
                Action:
                  - apprunner:DescribeService
                  - apprunner:ListServices
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                  - cloudwatch:DescribeAlarms
                  - ec2:Describe*
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:ListClusters
                  - ecs:ListServices
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - elasticache:Describe*
                  - kms:DescribeKey
                  - kms:ListAliases
                  - lambda:GetFunctionConfiguration
                  - lambda:ListFunctions
                  - rds:Describe*
                  - s3:GetBucketEncryption
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - s3:ListAllMyBuckets
                  - secretsmanager:DescribeSecret
                  - secretsmanager:ListSecrets
                  - tag:GetResources
                Resource: "*"

Outputs:
  DiscoveryRoleArn:
    Description: Provide this output to davdeploy only if automatic verification is unavailable.
    Value: !GetAtt DiscoveryRole.Arn
  ConnectionId:
    Value: !Ref ConnectionId
