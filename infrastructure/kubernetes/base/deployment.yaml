apiVersion: apps/v1
kind: Deployment
metadata:
  name: davdeploy-api
  namespace: davdeploy
spec:
  replicas: 2
  selector:
    matchLabels: { app: davdeploy-api }
  template:
    metadata:
      labels: { app: davdeploy-api }
    spec:
      serviceAccountName: davdeploy-api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: REPLACE_WITH_ECR_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: DAVDEPLOY_DATABASE_SECRET_ARN, value: REPLACE_WITH_RDS_SECRET_ARN }
            - { name: DAVDEPLOY_OTEL_ENDPOINT, value: http://otel-collector.davdeploy.svc:4318 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
