apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentconstruct-runtime
  namespace: agentconstruct
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: agentconstruct-aws
    kind: ClusterSecretStore
  target:
    name: agentconstruct-runtime
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: REPLACE_WITH_TERRAFORM_APPLICATION_SECRET_ARN
        property: database_url
