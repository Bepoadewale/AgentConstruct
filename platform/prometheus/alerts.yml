groups:
  - name: davdeploy-planned-pilot
    rules:
      - alert: davdeployApiUnavailable
        expr: up{job="davdeploy-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: davdeploy API is unavailable
      - alert: davdeployExecutionFailure
        expr: increase(davdeploy_execution_results_total{state="FAILED"}[10m]) > 0
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: A bounded execution was observed failed
