name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: make install
      - run: make lint && make test
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with: { version: '1.0.0' }
      - run: opa test platform/opa
  cloud-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-kubectl@v4
      - run: make terraform-validate && make kubernetes-render
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with: { path: ., output-file: sbom.spdx.json }
      - uses: aquasecurity/trivy-action@v0.9.2
        with: { scan-type: fs, ignore-unfixed: true, severity: CRITICAL,HIGH }
      - run: docker build -f apps/api/Dockerfile .
